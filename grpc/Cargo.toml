[package]
name = "grpc"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"

[[bin]]
name = "server"
path = "src/server.rs"

[build-dependencies]
tonic-prost-build = "0.14.6"
